name: household_management
description: "NyumbaSmart (Rahisi) - Shared Household Financial Management & Consumption Prediction App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend & Storage
  supabase_flutter: ^2.6.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0

  # Charts & UI
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities & Formatting
  intl: ^0.20.2
  uuid: ^4.4.2
  equatable: ^2.0.5
  collection: ^1.18.0
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  timezone: ^0.9.4
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env.example

